<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decodificador + GIFs</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    font-family: 'Courier New', monospace; 
    background: #008080; 
    padding: 10px; 
    margin: 0; 
    overflow-x: hidden; 
  }
  
  .win95 { 
    background: #c0c0c0; 
    border-top: 2px solid #fff; 
    border-left: 2px solid #fff; 
    border-right: 2px solid #000; 
    border-bottom: 2px solid #000; 
    padding: 12px; 
    margin-bottom: 12px; 
    border-radius: 2px;
  }
  
  .rainbow { 
    font-size: 20px; 
    animation: color 2s infinite; 
    font-weight: bold; 
    word-wrap: break-word; 
    min-height: 30px; 
    line-height: 1.4;
  }
  
  @keyframes color { 
    0%{color:#ff0000;} 33%{color:#00ff00;} 66%{color:#0000ff;} 100%{color:#ff0000;} 
  }
  
  .box { 
    display: inline-block; 
    border: 1px solid #000; 
    padding: 6px 8px; 
    margin: 3px; 
    background: #eee; 
    font-size: 14px; 
    text-align: center;
  }
  
  input, textarea { 
    width: 100%; 
    padding: 10px; 
    border-top: 2px solid #808080; 
    border-left: 2px solid #808080; 
    border-right: 2px solid #fff; 
    border-bottom: 2px solid #fff; 
    font-family: inherit; 
    font-size: 16px; /* Previene zoom en iOS */
    margin-top: 5px; 
    background: #fff;
  }
  
  textarea { 
    height: 80px; 
    resize: vertical; 
  }
  
  button { 
    background: #c0c0c0; 
    border-top: 2px solid #fff; 
    border-left: 2px solid #fff; 
    border-right: 2px solid #000; 
    border-bottom: 2px solid #000; 
    padding: 10px 12px; 
    cursor: pointer; 
    font-family: inherit; 
    font-size: 15px; 
    margin-top: 8px; 
    width: 100%; 
    font-weight: bold;
  }
  
  button:active { 
    border-top: 2px solid #000; 
    border-left: 2px solid #000; 
    border-right: 2px solid #fff; 
    border-bottom: 2px solid #fff; 
  }
  
  h2 { 
    font-size: 20px; 
    margin-top: 0; 
    text-align: center;
    text-shadow: 1px 1px 0 #fff;
  }
  
  p { 
    margin: 5px 0 8px 0; 
    font-size: 15px; 
    font-weight: bold;
  }
  
  /* GIF Controls */
  .gif-controls { 
    display: flex; 
    gap: 8px; 
    margin-top: 10px; 
    align-items: center; 
    flex-wrap: wrap; 
  }
  
  .gif-controls label { 
    font-size: 13px; 
    font-weight: bold;
    flex-basis: 100%;
  }
  
  .gif-controls input[type=range] { 
    flex: 1; 
    min-width: 120px; 
    margin-top: 0;
    padding: 0;
  }
  
  .gif-controls button { 
    width: auto; 
    padding: 8px 12px; 
    margin-top: 0;
    flex: 1;
  }
  
  #gifGallery { 
    display: flex; 
    gap: 8px; 
    flex-wrap: wrap; 
    margin-top: 10px; 
    padding: 8px; 
    background: white; 
    border-top: 2px solid #808080; 
    border-left: 2px solid #808080; 
    border-right: 2px solid #fff; 
    border-bottom: 2px solid #fff; 
    min-height: 50px; 
  }
  
  .gif-thumb { 
    width: 48px; 
    height: 48px; 
    background: #fff; 
    border: 1px solid #808080; 
    cursor: pointer; 
    padding: 2px; 
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .gif-thumb img { 
    width: 100%; 
    height: 100%; 
    object-fit: contain; 
  }
  
  /* Floating GIFs */
  .floating-gif { 
    position: absolute; 
    cursor: grab; 
    user-select: none; 
    z-index: 10; 
    touch-action: none; 
  }
  
  .floating-gif:active { 
    cursor: grabbing; 
  }
  
  .floating-gif img { 
    width: 100%; 
    height: 100%; 
    pointer-events: none; 
    display: block; 
  }
  
  /* Botones de control de GIF más grandes para táctil */
  .gif-remove { 
    position: absolute; 
    top: -10px; 
    right: -10px; 
    width: 28px; 
    height: 28px; 
    background: #c0c0c0; 
    border-top: 2px solid #fff; 
    border-left: 2px solid #fff; 
    border-right: 2px solid #000; 
    border-bottom: 2px solid #000; 
    font-size: 16px; 
    line-height: 24px; 
    text-align: center; 
    cursor: pointer; 
    z-index: 11; 
    font-weight: bold;
  }
  
  .gif-resize { 
    position: absolute; 
    right: -10px; 
    bottom: -10px; 
    width: 28px; 
    height: 28px; 
    background: #c0c0c0; 
    border-top: 2px solid #fff; 
    border-left: 2px solid #fff; 
    border-right: 2px solid #000; 
    border-bottom: 2px solid #000; 
    cursor: nwse-resize; 
    z-index: 12; 
    touch-action: none; 
  }
  
  .gif-resize::after { 
    content: '⤡'; 
    font-size: 14px; 
    display: block; 
    text-align: center; 
    line-height: 24px; 
    color: #000; 
  }
  
  .range-info { 
    font-size: 12px; 
    color: #333; 
    margin-top: 8px; 
    font-style: italic;
  }
  
  /* Ajustes para pantallas grandes */
  @media (min-width: 768px) {
    body { padding: 30px; }
    .win95 { padding: 20px; margin-bottom: 20px; }
    .rainbow { font-size: 28px; }
    .box { font-size: 16px; padding: 8px 12px; }
    h2 { font-size: 26px; }
    button { width: auto; min-width: 150px; }
    .gif-controls button { width: auto; }
  }
</style>
</head>
<body>
  <h2>🔬 Decodificador de Iniciales</h2>
  
  <div class="win95">
    <p>1. Cargar CSV (Formato: Inicial;Palabra)</p>
    <input type="file" id="csv" accept=".csv">
  </div>
  
  <div class="win95">
    <p>2. Iniciales cargadas:</p>
    <div id="iniciales"></div>
  </div>
  
  <div class="win95">
    <p>3. Buscar por número (automático):</p>
    <input type="number" id="num" oninput="buscar()" placeholder="Escribe el número aquí..." inputmode="numeric">
    <p id="resultado" style="font-size:22px; font-weight:bold; margin-top:15px; color:#000080; word-wrap: break-word; min-height: 30px;"></p>
  </div>
  
  <div class="win95">
    <p>4. Escribe en Hindi (Arcoíris):</p>
    <textarea id="hindi" oninput="actualizarHindi()" placeholder="Escribe aquí..."></textarea>
    <button onclick="borrarHindi()">🗑 Borrar arcoíris</button>
    <div id="out" class="rainbow"></div>
  </div>

  <div class="win95">
    <p>✨ GIFs transparentes</p>
    <input type="file" id="gifInput" accept="image/gif" multiple>
    <div class="gif-controls">
      <label>Tamaño de todos los GIFs:</label>
      <input type="range" id="gifSize" min="30" max="400" value="100">
      <button id="gifClearAll">🗑 Quitar todos</button>
    </div>
    <div id="gifGallery"></div>
    <div class="range-info">💡 Arrastra el GIF para moverlo · Esquina ⤡ para cambiar tamaño · ✕ para borrar.</div>
  </div>

  <script>
    let datos = [];
    let textoArcoiris = '';
    
    // 1. Carga de CSV
    document.getElementById('csv').onchange = function(e) {
      let reader = new FileReader();
      reader.onload = function(ev) {
        let lineas = ev.target.result.split('\n');
        datos = [];
        let html = '';
        lineas.forEach((linea, i) => {
          let partes = linea.split(';');
          if(partes.length >= 2 && partes[0].trim() !== '') {
            let num = i + 1;
            datos.push({n: num, i: partes[0].trim(), p: partes[1].trim()});
            html += '<span class="box"><b>'+partes[0].trim()+'</b><br><small>('+num+')</small></span>';
          }
        });
        document.getElementById('iniciales').innerHTML = html || '<em>No se encontraron datos válidos.</em>';
      };
      reader.readAsText(e.target.files[0]);
    };
    
    // 2. Búsqueda automática
    function buscar() {
      let n = parseInt(document.getElementById('num').value);
      let res = datos.find(d => d.n === n);
      document.getElementById('resultado').innerText = res ? res.p : '';
    }

    // 3. Lógica del Arcoíris (solo crece, no se encoge con backspace)
    function actualizarHindi() {
      let texto = document.getElementById('hindi').value;
      if (texto.length > textoArcoiris.length) {
        textoArcoiris = texto;
        document.getElementById('out').innerText = textoArcoiris;
      }
    }

    function borrarHindi() {
      textoArcoiris = '';
      document.getElementById('hindi').value = '';
      document.getElementById('out').innerText = '';
    }

    // 4. Sistema de GIFs
    const gifInput = document.getElementById('gifInput');
    const gifGallery = document.getElementById('gifGallery');
    const gifSize = document.getElementById('gifSize');
    const gifClearAll = document.getElementById('gifClearAll');
    let currentGifSize = 100;

    gifSize.addEventListener('input', e => {
      currentGifSize = parseInt(e.target.value);
      document.querySelectorAll('.floating-gif').forEach(g => {
        g.style.width = currentGifSize + 'px';
        g.style.height = currentGifSize + 'px';
      });
    });

    gifClearAll.addEventListener('click', () => {
      document.querySelectorAll('.floating-gif').forEach(g => g.remove());
      gifGallery.innerHTML = '';
    });

    gifInput.addEventListener('change', e => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        if (!file.type.startsWith('image/gif')) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const dataUrl = ev.target.result;
          const thumb = document.createElement('div');
          thumb.className = 'gif-thumb';
          thumb.innerHTML = `<img src="${dataUrl}" alt="gif">`;
          thumb.title = 'Toca para colocar otro GIF';
          thumb.addEventListener('click', () => spawnGif(dataUrl));
          gifGallery.appendChild(thumb);
          spawnGif(dataUrl);
        };
        reader.readAsDataURL(file);
      });
      gifInput.value = ''; // Reset para permitir subir el mismo archivo de nuevo
    });

    function spawnGif(src) {
      const size = currentGifSize;
      const wrap = document.createElement('div');
      wrap.className = 'floating-gif';
      wrap.style.width = size + 'px';
      wrap.style.height = size + 'px';
      
      // Calcular límites seguros para que no nazca fuera de la pantalla
      const margin = 20;
      const maxX = Math.max(margin, window.innerWidth - size - margin);
      const maxY = Math.max(margin, window.innerHeight - size - margin);
      
      wrap.style.left = (Math.random() * maxX) + 'px';
      wrap.style.top  = (Math.random() * maxY) + 'px';
      wrap.innerHTML = `<img src="${src}" alt="gif"><div class="gif-remove">✕</div><div class="gif-resize"></div>`;
      document.body.appendChild(wrap);

      wrap.querySelector('.gif-remove').addEventListener('click', ev => {
        ev.stopPropagation();
        wrap.remove();
      });

      const handle = wrap.querySelector('.gif-resize');
      handle.addEventListener('mousedown', ev => ev.stopPropagation());
      handle.addEventListener('touchstart', ev => ev.stopPropagation(), { passive: false });

      makeDraggable(wrap);
      makeResizable(wrap, handle);
    }

    function makeDraggable(el) {
      let startX, startY, origX, origY, dragging = false;

      const onStart = (e) => {
        const pt = e.touches ? e.touches[0] : e;
        dragging = true;
        startX = pt.clientX;
        startY = pt.clientY;
        origX = parseInt(el.style.left) || 0;
        origY = parseInt(el.style.top) || 0;
        el.style.zIndex = 100;
        if (e.cancelable) e.preventDefault();
      };

      const onMove = (e) => {
        if (!dragging) return;
        const pt = e.touches ? e.touches[0] : e;
        let nx = origX + (pt.clientX - startX);
        let ny = origY + (pt.clientY - startY);
        
        // Mantener dentro de los límites de la ventana
        nx = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, nx));
        ny = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, ny));
        
        el.style.left = nx + 'px';
        el.style.top  = ny + 'px';
        if (e.cancelable) e.preventDefault();
      };

      const onEnd = () => {
        if (!dragging) return;
        dragging = false;
        el.style.zIndex = 10;
      };

      el.addEventListener('mousedown', onStart);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      el.addEventListener('touchstart', onStart, { passive: false });
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    }

    function makeResizable(el, handle) {
      let startX, startY, startW, startH, resizing = false;
      const MIN = 30;
      const MAX = Math.max(300, Math.min(window.innerWidth, window.innerHeight));

      const onStart = (e) => {
        const pt = e.touches ? e.touches[0] : e;
        resizing = true;
        startX = pt.clientX;
        startY = pt.clientY;
        startW = el.offsetWidth;
        startH = el.offsetHeight;
        el.style.zIndex = 100;
        if (e.cancelable) e.preventDefault();
      };

      const onMove = (e) => {
        if (!resizing) return;
        const pt = e.touches ? e.touches[0] : e;
        const dx = pt.clientX - startX;
        const dy = pt.clientY - startY;
        let delta = Math.max(dx, dy);
        let newW = Math.max(MIN, Math.min(MAX, startW + delta));
        let newH = Math.max(MIN, Math.min(MAX, startH + delta));
        el.style.width  = newW + 'px';
        el.style.height = newH + 'px';
        if (e.cancelable) e.preventDefault();
      };

      const onEnd = () => {
        if (!resizing) return;
        resizing = false;
        el.style.zIndex = 10;
      };

      handle.addEventListener('mousedown', onStart);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      handle.addEventListener('touchstart', onStart, { passive: false });
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    }
    
    // Ajuste dinámico si se gira la pantalla o cambia el tamaño de la ventana
    window.addEventListener('resize', () => {
      document.querySelectorAll('.floating-gif').forEach(g => {
        let x = parseInt(g.style.left);
        let y = parseInt(g.style.top);
        g.style.left = Math.min(x, window.innerWidth - g.offsetWidth) + 'px';
        g.style.top = Math.min(y, window.innerHeight - g.offsetHeight) + 'px';
      });
    });
  </script>
</body>
</html>
